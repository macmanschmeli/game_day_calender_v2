<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Month View Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="calendar-wrapper" id="calendarApp" aria-label="Month view calendar">

    <!-- Toolbar: month/year label + navigation -->
    <header class="calendar-toolbar">
      <h1 class="calendar-month-label" id="monthLabel" aria-live="polite">Month Year</h1>
      <div class="nav-controls">
        <button type="button" id="todayBtn" class="nav-btn nav-btn--text">Today</button>
        <button type="button" id="prevBtn" class="nav-btn nav-btn--icon" aria-label="Previous month">
          <svg width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true">
            <path d="M7 1L1.5 6.5L7 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" id="nextBtn" class="nav-btn nav-btn--icon" aria-label="Next month">
          <svg width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true">
            <path d="M1 1L6.5 6.5L1 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Weekday header row -->
    <div class="weekday-row" id="weekdayRow" role="row"></div>

    <!-- 7-column day grid -->
    <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="Calendar days"></div>

  </main>

  <!-- Popover / modal for appointment details and day overflow lists -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-box" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalContent"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
